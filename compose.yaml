
services:

  db:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: finance_tracker
      MYSQL_USER: finance_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysql -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" -e "SELECT 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: finance-tracker:1.0
    restart: unless-stopped

    ports:
      - "8081:8080"

    environment:
      DB_URL: jdbc:mysql://db:3306/finance_tracker?sslMode=DISABLED&allowPublicKeyRetrieval=true
      DB_USERNAME: finance_app
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}

    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:

