
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Finance Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body class="bg-light">


<div th:replace="~{fragments/navbar :: navbar('dashboard')}"></div>


<main class="container py-5">

    <div class="mb-4">
        <h2 class="fw-bold">
            Welcome,
            <span th:text="${firstName}">User</span>!
        </h2>

        <p class="text-muted">
            Here is your financial overview.
        </p>
    </div>

    <div class="row g-4">

        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-body p-4">
                    <p class="text-muted mb-2">Total Income</p>

                    <h3 class="fw-bold text-success"
                        th:text="${summary.totalIncome()}">
                        0.00
                    </h3>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-body p-4">
                    <p class="text-muted mb-2">Total Expenses</p>

                    <h3 class="fw-bold text-danger"
                        th:text="${summary.totalExpenses()}">
                        0.00
                    </h3>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-body p-4">
                    <p class="text-muted mb-2">Current Balance</p>

                    <h3 class="fw-bold text-primary"
                        th:text="${summary.balance()}">
                        0.00
                    </h3>
                </div>
            </div>
        </div>

    </div>

    <div class="card border-0 shadow-sm rounded-4 mt-4">
        <div class="card-body p-4">
            <h5 class="fw-semibold mb-3">Quick Actions</h5>

            <div class="d-flex flex-wrap gap-3">

                <a th:href="@{/transactions}"
                   class="btn btn-primary">
                    Manage Transactions
                </a>

                <a th:href="@{/categories}"
                   class="btn btn-outline-primary">
                    Manage Categories
                </a>

            </div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
