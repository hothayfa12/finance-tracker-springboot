
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Dashboard | Finance Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar bg-white border-bottom shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary"
           th:href="@{/dashboard}">
            Finance Tracker
        </a>

        <form th:action="@{/logout}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit"
                    class="btn btn-outline-danger btn-sm">
                Logout
            </button>
        </form>
    </div>
</nav>

<main class="container py-5">

    <div class="mb-4">
        <h2 class="fw-bold">
            Welcome,
            <span th:text="${firstName}">User</span>!
        </h2>

        <p class="text-muted">
            Manage your finances in one place.
        </p>
    </div>

    <div class="row g-4">

        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <p class="text-muted mb-2">Total Income</p>
                    <h3 class="text-success mb-0">—</h3>
                    <small class="text-muted">Coming next</small>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <p class="text-muted mb-2">Total Expenses</p>
                    <h3 class="text-danger mb-0">—</h3>
                    <small class="text-muted">Coming next</small>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <p class="text-muted mb-2">Current Balance</p>
                    <h3 class="text-primary mb-0">—</h3>
                    <small class="text-muted">Coming next</small>
                </div>
            </div>
        </div>

    </div>

    <div class="card border-0 shadow-sm rounded-4 mt-4">
        <div class="card-body p-4">
            <h5 class="fw-semibold">Your Finance Dashboard</h5>

            <p class="text-muted mb-0">
                Your categories, transactions and financial
                reports will appear here.
            </p>
        </div>
    </div>

</main>

</body>
</html>
