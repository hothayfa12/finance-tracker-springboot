
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transactions | Finance Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body class="bg-light">


<div th:replace="~{fragments/navbar :: navbar('transactions')}"></div>


<main class="container py-5">

    <div class="mb-4">
        <h2 class="fw-bold">Transactions</h2>
        <p class="text-muted">
            Track your income and expenses.
        </p>
    </div>

    <div th:if="${successMessage}"
         class="alert alert-success"
         th:text="${successMessage}"></div>

    <!-- Add Transaction -->
    <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-body p-4">

            <h5 class="fw-semibold mb-3">Add Transaction</h5>

            <div th:if="${#lists.isEmpty(categories)}"
                 class="alert alert-warning">
                You need to create a category first.
                <a th:href="@{/categories}">Manage Categories</a>
            </div>

            <form th:action="@{/transactions}"
                  th:object="${transactionRequest}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div th:if="${#fields.hasGlobalErrors()}"
                     class="alert alert-danger">
                    <div th:each="err : ${#fields.globalErrors()}"
                         th:text="${err}"></div>
                </div>

                <div class="row g-3">

                    <div class="col-md-3">
                        <label class="form-label">Type</label>
                        <select th:field="*{type}"
                                class="form-select" required>
                            <option value="EXPENSE">Expense</option>
                            <option value="INCOME">Income</option>
                        </select>
                        <div class="text-danger small"
                             th:errors="*{type}"></div>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Amount</label>
                        <input type="number"
                               th:field="*{amount}"
                               class="form-control"
                               step="0.01"
                               min="0.01"
                               placeholder="0.00"
                               required>
                        <div class="text-danger small"
                             th:errors="*{amount}"></div>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Category</label>
                        <select th:field="*{categoryId}"
                                class="form-select" required>
                            <option value="">Select Category</option>
                            <option th:each="category : ${categories}"
                                    th:value="${category.id}"
                                    th:text="${category.name}">
                            </option>
                        </select>
                        <div class="text-danger small"
                             th:errors="*{categoryId}"></div>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Date</label>
                        <input type="date"
                               th:field="*{date}"
                               class="form-control" required>
                        <div class="text-danger small"
                             th:errors="*{date}"></div>
                    </div>

                </div>

                <button type="submit"
                        class="btn btn-primary mt-4"
                        th:disabled="${#lists.isEmpty(categories)}">
                    Add Transaction
                </button>
            </form>
        </div>
    </div>

    <!-- Transactions Table -->
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">

            <h5 class="fw-semibold mb-3">
                Transaction History
            </h5>

            <div th:if="${#lists.isEmpty(transactions)}"
                 class="text-center text-muted py-4">
                No transactions yet.
            </div>

            <div th:unless="${#lists.isEmpty(transactions)}"
                 class="table-responsive">

                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="transaction : ${transactions}">

                        <td th:text="${transaction.date}"></td>

                        <td th:text="${transaction.category.name}"></td>

                        <td>
                            <span class="badge"
                                  th:classappend="${transaction.type == 'INCOME'}
                                    ? 'text-bg-success' : 'text-bg-danger'"
                                  th:text="${transaction.type}">
                            </span>
                        </td>

                        <td class="fw-semibold"
                            th:classappend="${transaction.type == 'INCOME'}
                                ? 'text-success' : 'text-danger'"
                            th:text="${transaction.amount}">
                        </td>

                        <td>
                            <div class="d-flex gap-2 justify-content-end">

                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{/transactions/{id}/edit(id=${transaction.id})}">
                                    Edit
                                </a>

                                <form th:action="@{/transactions/{id}/delete(id=${transaction.id})}"
                                      method="post"
                                      onsubmit="return confirm('Delete this transaction?');">

                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">

                                    <button class="btn btn-sm btn-outline-danger"
                                            type="submit">
                                        Delete
                                    </button>
                                </form>

                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
