
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Edit Category | Finance Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">

                    <h3 class="fw-bold mb-2">Edit Category</h3>

                    <p class="text-muted mb-4">
                        Update your category name.
                    </p>

                    <form th:action="@{/categories/{id}/edit(id=${categoryId})}"
                          th:object="${categoryRequest}"
                          method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <div th:if="${#fields.hasGlobalErrors()}"
                             class="alert alert-danger">
                            <div th:each="err : ${#fields.globalErrors()}"
                                 th:text="${err}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Category Name
                            </label>

                            <input type="text"
                                   th:field="*{name}"
                                   class="form-control"
                                   maxlength="100"
                                   required>

                            <div class="text-danger small"
                                 th:errors="*{name}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit"
                                    class="btn btn-primary">
                                Save Changes
                            </button>

                            <a th:href="@{/categories}"
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
