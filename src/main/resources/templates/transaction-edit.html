
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Transaction | Finance Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">

                    <h3 class="fw-bold mb-2">Edit Transaction</h3>
                    <p class="text-muted mb-4">
                        Update your financial transaction.
                    </p>

                    <form th:action="@{/transactions/{id}/edit(id=${transactionId})}"
                          th:object="${transactionRequest}"
                          method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <div th:if="${#fields.hasGlobalErrors()}"
                             class="alert alert-danger">
                            <div th:each="err : ${#fields.globalErrors()}"
                                 th:text="${err}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Type</label>
                            <select th:field="*{type}"
                                    class="form-select" required>
                                <option value="INCOME">Income</option>
                                <option value="EXPENSE">Expense</option>
                            </select>
                            <div class="text-danger small"
                                 th:errors="*{type}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Amount</label>
                            <input type="number"
                                   th:field="*{amount}"
                                   class="form-control"
                                   step="0.01"
                                   min="0.01"
                                   required>
                            <div class="text-danger small"
                                 th:errors="*{amount}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select th:field="*{categoryId}"
                                    class="form-select" required>
                                <option value="">Select Category</option>
                                <option th:each="category : ${categories}"
                                        th:value="${category.id}"
                                        th:text="${category.name}">
                                </option>
                            </select>
                            <div class="text-danger small"
                                 th:errors="*{categoryId}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Date</label>
                            <input type="date"
                                   th:field="*{date}"
                                   class="form-control" required>
                            <div class="text-danger small"
                                 th:errors="*{date}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit"
                                    class="btn btn-primary">
                                Save Changes
                            </button>

                            <a th:href="@{/transactions}"
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
