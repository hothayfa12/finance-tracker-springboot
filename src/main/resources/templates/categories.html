
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categories | Finance Tracker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar bg-white border-bottom shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary"
       th:href="@{/dashboard}">
      Finance Tracker
    </a>

    <div class="d-flex gap-3 align-items-center">
      <a class="text-decoration-none"
         th:href="@{/dashboard}">Dashboard</a>

      <a class="text-decoration-none fw-bold"
         th:href="@{/categories}">Categories</a>

      <form th:action="@{/logout}" method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <button class="btn btn-outline-danger btn-sm">
          Logout
        </button>
      </form>
    </div>
  </div>
</nav>

<main class="container py-5">

  <div class="mb-4">
    <h2 class="fw-bold">Manage Categories</h2>
    <p class="text-muted">
      Organize your income and expenses.
    </p>
  </div>

  <div th:if="${successMessage}"
       class="alert alert-success"
       th:text="${successMessage}"></div>

  <div th:if="${errorMessage}"
       class="alert alert-danger"
       th:text="${errorMessage}"></div>

  <div class="row g-4">

    <!-- Create Category -->
    <div class="col-lg-4">
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">
          <h5 class="fw-semibold mb-3">
            Add Category
          </h5>

          <form th:action="@{/categories}"
                th:object="${categoryRequest}"
                method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div th:if="${#fields.hasGlobalErrors()}"
                 class="alert alert-danger">
              <div th:each="err : ${#fields.globalErrors()}"
                   th:text="${err}"></div>
            </div>

            <div class="mb-3">
              <label class="form-label">
                Category Name
              </label>

              <input type="text"
                     th:field="*{name}"
                     class="form-control"
                     placeholder="e.g. Food, Salary"
                     maxlength="100"
                     required>

              <div class="text-danger small"
                   th:errors="*{name}"></div>
            </div>

            <button type="submit"
                    class="btn btn-primary w-100">
              Add Category
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Category List -->
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">

          <h5 class="fw-semibold mb-3">
            Your Categories
          </h5>

          <div th:if="${#lists.isEmpty(categories)}"
               class="text-center text-muted py-4">
            No categories yet.
            Create your first category!
          </div>

          <div th:unless="${#lists.isEmpty(categories)}"
               class="table-responsive">

            <table class="table table-hover align-middle">
              <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th class="text-end">Actions</th>
              </tr>
              </thead>

              <tbody>
              <tr th:each="category : ${categories}">
                <td th:text="${category.id}"></td>
                <td th:text="${category.name}"></td>

                <td class="text-end">
                  <div class="d-flex gap-2 justify-content-end">

                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/categories/{id}/edit(id=${category.id})}">
                      Edit
                    </a>

                    <form th:action="@{/categories/{id}/delete(id=${category.id})}"
                          method="post"
                          onsubmit="return confirm('Delete this category?');">

                      <input type="hidden"
                             th:name="${_csrf.parameterName}"
                             th:value="${_csrf.token}">

                      <button type="submit"
                              class="btn btn-sm btn-outline-danger">
                        Delete
                      </button>
                    </form>
                  </div>
                </td>
              </tr>
              </tbody>
            </table>

          </div>
        </div>
      </div>
    </div>

  </div>
</main>

</body>
</html>
