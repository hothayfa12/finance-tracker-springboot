
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<body>

<nav th:fragment="navbar(activePage)"
     class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold text-primary"
           th:href="@{/dashboard}">
            Finance Tracker
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse"
             id="mainNavbar">

            <div class="navbar-nav ms-auto me-3">

                <a class="nav-link"
                   th:classappend="${activePage == 'dashboard'} ? 'active fw-bold'"
                   th:href="@{/dashboard}">
                    Dashboard
                </a>

                <a class="nav-link"
                   th:classappend="${activePage == 'categories'} ? 'active fw-bold'"
                   th:href="@{/categories}">
                    Categories
                </a>

                <a class="nav-link"
                   th:classappend="${activePage == 'transactions'} ? 'active fw-bold'"
                   th:href="@{/transactions}">
                    Transactions
                </a>

            </div>

            <form th:action="@{/logout}"
                  method="post"
                  class="mt-2 mt-lg-0">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit"
                        class="btn btn-outline-danger btn-sm">
                    Logout
                </button>
            </form>

        </div>
    </div>
</nav>

</body>
</html>
